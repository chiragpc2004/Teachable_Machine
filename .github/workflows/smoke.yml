name: Smoke test (deployed site)

# Runs the @smoke end-to-end tests against a deployed URL:
# - automatically, when a deployment reports success to GitHub (Cloudflare Pages does this for
#   repos connected through its GitHub app: preview deploys for PRs, production for main);
# - or by hand: Actions → "Smoke test (deployed site)" → Run workflow, and paste the URL.
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: "Site URL, e.g. https://teachable.pages.dev"
        required: true

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      SMOKE_URL: ${{ inputs.url || github.event.deployment_status.environment_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: echo "Testing $SMOKE_URL"
      - run: npm run test:smoke
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: smoke-report
          path: frontend/test-results/
          retention-days: 7
